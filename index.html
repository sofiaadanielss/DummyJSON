<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi panel con DummyJSON</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Mi panel con DummyJSON</h1>
    <h2>Click para iniciar sesion</h2>

    <form id="loginSection">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username"/><br>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"/><br>
        <button type="submit" id="loginBtn">Login</button>
    </form>

    <p id="message" role="alert" style="color: #c0392b;"></p>
    
    <section id="profileSection" hidden>
        <h2>Mi perfil</h2>
        <img id="profile-image" alt="Foto de perfil" width="120" height="120">
        <h3 id="profile-name"></h3>
 
        <ul>
            <li><strong>Correo:</strong> <span id="profile-email"></span></li>
            <li><strong>Usuario:</strong> <span id="profile-username"></span></li>
            <li><strong>Numero:</strong> <span id="profile-phone"></span></li>
            <li><strong>Ciudad:</strong> <span id="profile-city"></span></li>
        </ul>
 
        <button type="button" id="logoutBtn">Cerrar sesion</button>
    </section>
 


    <script src="script.js"></script>
</body>
</html>
